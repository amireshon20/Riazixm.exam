<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سامانه آزمون آنلاین riazixm</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // اتصال به دیتابیس اختصاصی مهندس امیرحسین زارعی
    const firebaseConfig = {
      apiKey: "AIzaSyBWLduVJYmmoldCSCacdA0ZKCQ61o9HVUE",
      authDomain: "riazixm.firebaseapp.com",
      projectId: "riazixm",
      storageBucket: "riazixm.firebasestorage.app",
      messagingSenderId: "1002384436216",
      appId: "1:1002384436216:web:59d92ecdf549045030440d"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const storage = firebase.storage();

    function App() {
      const [role, setRole] = useState(null);
      const [teacherLoggedIn, setTeacherLoggedIn] = useState(false);
      const [loginPass, setLoginPass] = useState('');
      
      // Teacher States
      const [examTitle, setExamTitle] = useState('');
      const [examPassword, setExamPassword] = useState('');
      const [file, setFile] = useState(null);
      const [questionCount, setQuestionCount] = useState(10);
      const [uploading, setUploading] = useState(false);
      const [message, setMessage] = useState('');

      // Student States
      const [studentPass, setStudentPass] = useState('');
      const [activeExam, setActiveExam] = useState(null);
      const [studentAnswers, setStudentAnswers] = useState({});
      const [score, setScore] = useState(null);

      const handleTeacherLogin = () => {
        if (loginPass === '1234') { setTeacherLoggedIn(true); } 
        else { alert('رمز عبور استاد اشتباه است.'); }
      };

      const handleCreateExam = async () => {
        if (!examTitle  !examPassword  !file) {
          setMessage('لطفاً عنوان، رمز و فایل سوالات را وارد کنید.');
          return;
        }
        setUploading(true);
        try {
          const storageRef = storage.ref(exams/${Date.now()}_${file.name});
          const snapshot = await storageRef.put(file);
          const downloadURL = await snapshot.ref.getDownloadURL();
          
          await db.collection("exams").add({
            title: examTitle,
            password: examPassword,
            fileUrl: downloadURL,
            questionCount: parseInt(questionCount),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          setMessage('✅ آزمون با موفقیت ساخته شد و در سرور ذخیره گردید.');
          setExamTitle(''); setExamPassword(''); setFile(null);
        } catch (error) {
          setMessage('❌ خطا در آپلود: ' + error.message);
        }
        setUploading(false);
      };

      const handleStudentLogin = async () => {
        setUploading(true);
        const snapshot = await db.collection("exams").where("password", "==", studentPass).get();
        if (snapshot.empty) {
          alert('آزمونی با این رمز یافت نشد.');
        } else {
          setActiveExam(snapshot.docs[0].data());
        }
        setUploading(false);
      };
const submitExam = () => {
        let correct = Object.keys(studentAnswers).length; // در نسخه اصلی پاسخنامه کلیدی اضافه می‌شود
        setScore(شما به ${correct} سوال پاسخ دادید. (سیستم تصحیح خودکار ثبت شد));
      };

      return (
        <div className="min-h-screen flex flex-col items-center py-10 px-4">
          <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div className="bg-blue-900 text-white text-center py-6">
              <h1 className="text-2xl font-bold">سامانه آزمون آنلاین</h1>
              <p className="mt-1 text-blue-200">مهندس امیرحسین زارعی - riazixm</p>
            </div>
            
            <div className="p-8">
              {!role && (
                <div className="space-y-4">
                  <button onClick={() => setRole('teacher')} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold shadow-md hover:bg-blue-700">ورود به پنل استاد</button>
                  <button onClick={() => setRole('student')} className="w-full py-4 bg-emerald-500 text-white rounded-xl font-bold shadow-md hover:bg-emerald-600">شرکت در آزمون (دانش‌آموز)</button>
                </div>
              )}

              {role === 'teacher' && !teacherLoggedIn && (
                <div className="space-y-4 text-center">
                  <h2 className="font-bold text-xl mb-4">ورود مدیریت</h2>
                  <input type="password" placeholder="رمز عبور استاد (1234)" className="w-full p-3 border rounded text-center" value={loginPass} onChange={e => setLoginPass(e.target.value)} />
                  <button onClick={handleTeacherLogin} className="w-full py-3 bg-blue-600 text-white rounded font-bold">ورود</button>
                  <button onClick={() => setRole(null)} className="text-gray-500 underline mt-4 block w-full">بازگشت</button>
                </div>
              )}

              {role === 'teacher' && teacherLoggedIn && (
                <div className="space-y-4">
                  <h2 className="font-bold text-xl text-blue-800 border-b pb-2">ساخت آزمون جدید</h2>
                  <input type="text" placeholder="عنوان آزمون (مثلاً: تست هندسه دهم)" className="w-full p-3 border rounded" value={examTitle} onChange={e => setExamTitle(e.target.value)} />
                  <input type="text" placeholder="رمز ورود برای دانش‌آموز" className="w-full p-3 border rounded" value={examPassword} onChange={e => setExamPassword(e.target.value)} />
                  <input type="number" placeholder="تعداد سوالات" className="w-full p-3 border rounded" value={questionCount} onChange={e => setQuestionCount(e.target.value)} />
                  <div className="border-2 border-dashed p-6 text-center rounded bg-gray-50">
                    <label className="cursor-pointer text-blue-600 font-bold">
                      انتخاب فایل سوالات (PDF یا عکس)
                      <input type="file" className="hidden" onChange={e => setFile(e.target.files[0])} accept=".pdf,image/*" />
                    </label>
                    {file && <p className="mt-2 text-green-600">{file.name}</p>}
                  </div>
                  <button onClick={handleCreateExam} disabled={uploading} className="w-full py-3 bg-green-600 text-white rounded font-bold">
                    {uploading ? 'در حال آپلود...' : 'آپلود و ذخیره آزمون'}
                  </button>
                  {message && <p className="text-center font-bold text-red-600 mt-2">{message}</p>}
                  <button onClick={() => setRole(null)} className="w-full py-2 bg-gray-200 text-gray-700 rounded mt-4">خروج از پنل</button>
                </div>
              )}

              {role === 'student' && !activeExam && (
                <div className="space-y-4 text-center">
                  <h2 className="font-bold text-xl mb-4">ورود به آزمون</h2>
<input type="text" placeholder="رمز آزمون را وارد کنید" className="w-full p-3 border rounded text-center" value={studentPass} onChange={e => setStudentPass(e.target.value)} />
                  <button onClick={handleStudentLogin} disabled={uploading} className="w-full py-3 bg-emerald-600 text-white rounded font-bold">
                    {uploading ? 'در حال جستجو...' : 'ورود به جلسه'}
                  </button>
                  <button onClick={() => setRole(null)} className="text-gray-500 underline mt-4 block w-full">بازگشت</button>
                </div>
              )}

              {role === 'student' && activeExam && !score && (
                <div className="space-y-6">
                  <h2 className="font-bold text-xl text-center text-blue-800">{activeExam.title}</h2>
                  <div className="w-full h-96 border rounded overflow-hidden">
                    <iframe src={activeExam.fileUrl} className="w-full h-full"></iframe>
                  </div>
                  <div className="bg-gray-100 p-4 rounded-xl">
                    <h3 className="font-bold mb-4 text-center">پاسخبرگ</h3>
                    <div className="grid grid-cols-2 gap-4">
                      {Array.from({ length: activeExam.questionCount }).map((_, i) => (
                        <div key={i} className="flex items-center justify-between bg-white p-2 rounded shadow-sm">
                          <span className="font-bold w-8">{i + 1}-</span>
                          {[1, 2, 3, 4].map(opt => (
                            <label key={opt} className="mx-1 cursor-pointer">
                              <input type="radio" name={q${i}} onChange={() => setStudentAnswers({...studentAnswers, [i]: opt})} className="mr-1" /> {opt}
                            </label>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                  <button onClick={submitExam} className="w-full py-3 bg-green-600 text-white font-bold rounded shadow-lg">پایان آزمون و ثبت نمره</button>
                </div>
              )}

              {score && (
                <div className="text-center p-8 bg-green-50 rounded-xl border border-green-200">
                  <h2 className="text-2xl font-bold text-green-800 mb-4">خسته نباشید!</h2>
                  <p className="text-lg font-bold">{score}</p>
                  <button onClick={() => window.location.reload()} className="mt-6 px-6 py-2 bg-blue-600 text-white rounded">بازگشت به صفحه اصلی</button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
