<!doctype html>

  <head>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- موتورهای اجرای سایت -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }</style>

    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // کلیدهای سرور فایربیس مهندس امیرحسین زارعی
      const firebaseConfig = {
        apiKey: "AIzaSyBWLduVJYmmoldCSCacdA0ZKCQ61o9HVUE",
        authDomain: "riazixm.firebaseapp.com",
        projectId: "riazixm",
        storageBucket: "riazixm.firebasestorage.app",
        messagingSenderId: "1002384436216",
        appId: "1:1002384436216:web:59d92ecdf549045030440d",
        measurementId: "G-CTN8J2V3GR"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const storage = firebase.storage();

      function App() {
        const [role, setRole] = useState(null);

        return (

            <div className="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">

                <p className="mt-2 text-blue-200">مهندس امیرحسین زارعی - riazixm</p>
              </div>
              
              <div className="p-8">
                {!role ? (
                  <div className="space-y-4">
                    <button 
                      onClick={() => setRole('teacher')} 
                      className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-all shadow-lg flex justify-center items-center gap-2">

                  <div className="text-center animate-fade-in">

                      </p>
                    </div>
                    <p className="text-gray-600 text-sm mb-6">
سیستم متصل و آماده استفاده است.
                    </p>
                    <button 
                      onClick={() => setRole(null)} 
                      className="text-red-500 font-bold hover:text-red-700 underline">
                      خروج از حساب
                    </button>
                  </div>
                )}
              </div>

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
